name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all targets
        run: bazelisk build //...

      - name: Run all tests
        run: bazelisk test //... --test_output=errors
